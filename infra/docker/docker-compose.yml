services:
  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        VITE_SERVER_URL: /api
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - server
    restart: unless-stopped

  server:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.server
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_PATH: /data/app.sqlite
      RECEIPT_UPLOAD_DIR: /receipts
      OCR_SERVICE_URL: http://ocr:8080/v1/receipt-ocr
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8080}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-to-a-long-random-string}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_ADDRESS: ${RESEND_FROM_ADDRESS:-login@example.com}
    volumes:
      - sqlite-data:/data
      - receipt-images:/receipts
    depends_on:
      - ocr

  ocr:
    build:
      context: ../..
      dockerfile: services/ocr/Dockerfile
    restart: unless-stopped
    environment:
      OCR_ADDR: :8080
      TESSERACT_LANG: ind+eng

  backup:
    profiles: ["backup"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.backup
    environment:
      DATABASE_PATH: /data/app.sqlite
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - sqlite-data:/data:ro
      - backup-data:/backups
    depends_on:
      - server

  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TUNNEL_TOKEN:-}
    depends_on:
      - web
    restart: unless-stopped

volumes:
  sqlite-data:
  receipt-images:
  backup-data:
