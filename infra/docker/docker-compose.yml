services:
  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        VITE_SERVER_URL: /api
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - server

  server:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.server
    environment:
      PORT: 4000
      DATABASE_PATH: /data/app.sqlite
      RECEIPT_UPLOAD_DIR: /receipts
      OCR_SERVICE_URL: http://ocr:8080/v1/receipt-ocr
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8080}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-to-a-long-random-string}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_ADDRESS: ${RESEND_FROM_ADDRESS:-login@example.com}
    volumes:
      - sqlite-data:/data
      - receipt-images:/receipts
    depends_on:
      - ocr

  ocr:
    build:
      context: ../..
      dockerfile: services/ocr/Dockerfile
    environment:
      OCR_ADDR: :8080
      TESSERACT_LANG: ind+eng

volumes:
  sqlite-data:
  receipt-images:
